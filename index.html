<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jessica França | Professional Profile</title>

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS - Note o PONTO antes da barra agora! -->
    <link rel="stylesheet" href="./src/css/variables.css">
    <link rel="stylesheet" href="./src/css/base.css">
    <link rel="stylesheet" href="./src/css/components/button.css">
    <link rel="stylesheet" href="./src/css/components/badge.css">
    <link rel="stylesheet" href="./src/css/components/card.css">
    <link rel="stylesheet" href="./src/css/components/hero.css">
    <link rel="stylesheet" href="./src/css/print.css">
</head>

<body
    style="font-family: var(--font-main); background-color: var(--secondary-color); color: var(--text-color); padding: var(--spacing-lg);">

    <!-- HEADER / HERO -->
    <header class="hero">
        <div class="hero-info">
            <h1>Jessica França</h1>
            <p data-i18n="header_title" class="hero-tagline">Senior Software Engineer & Architect</p>

            <div class="social-links">
                <a href="https://linkedin.com/in/jessica-franca-consultora" target="_blank" class="social-icon"
                    title="LinkedIn">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                    </svg>
                </a>
                <a href="https://github.com/jessicafram" target="_blank" class="social-icon" title="GitHub">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.338 9.8 7.962 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.042-1.416-4.042-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 3.518 1.304 4.376.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.665-1.59 8.003-6.088 8.003-11.385 0-6.627-5.373-12-12-12z" />
                    </svg>
                </a>

                <!-- Botão de Download PDF Minimalista -->
                <button id="download-pdf" class="social-icon" title="Baixar PDF" style="cursor: pointer; border: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
                        <polyline points="7 11 12 16 17 11"></polyline>
                        <line x1="12" y1="4" x2="12" y2="16"></line>
                    </svg>
                </button>
            </div>

            <!-- Idiomas -->
            <div class="controls-container">
                <button class="btn-lang active" data-lang="pt">PT</button>
                <button class="btn-lang" data-lang="en">EN</button>
                <button class="btn-lang" data-lang="es">ES</button>
            </div>
        </div>

        <!-- Foto Card -->
        <div class="photo-card">
            <img src="./public/img/jessica.png" alt="Jessica França" class="hero-image">
        </div>
    </header>

    <main style="max-width: 900px; margin: 0 auto;">

        <!-- 1. RESUMO ESTRATÉGICO -->
        <section id="summary" style="margin-bottom: var(--spacing-lg); max-width: 800px;">
            <p id="summary-text"
                style="font-size: 1.1rem; line-height: 1.8; color: var(--text-color); font-style: italic; border-left: 4px solid var(--primary-color); padding-left: 20px;">
                <!-- O JS injeta o resumo aqui -->
            </p>
        </section>

        <!-- 2. SELETOR DE PERFIL (CONTEXTO) -->
        <div class="profiles-container" style="margin-bottom: var(--spacing-lg);">
            <button class="chip-profile active" data-profile="fullstack">Fullstack</button>
            <button class="chip-profile" data-profile="backend">Backend</button>
            <button class="chip-profile" data-profile="ai">AI Engineer</button>
        </div>

        <!-- 3. MATRIZ TÉCNICA -->
        <section id="skills" style="margin-bottom: var(--spacing-lg);">
            <h2 data-i18n="section_skills"
                style="border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-bottom: var(--spacing-md); text-transform: uppercase; font-size: 1rem; letter-spacing: 2px;">
                Habilidades & Expertises
            </h2>
            <div id="skills-container"></div>
        </section>

        <!-- 4. EXPERIÊNCIA PROFISSIONAL -->
        <section id="experience" style="margin-bottom: var(--spacing-lg);">
            <h2 data-i18n="section_experience"
                style="border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-bottom: var(--spacing-md); text-transform: uppercase; font-size: 1rem; letter-spacing: 2px;">
                Experiência Profissional
            </h2>
            <div id="experience-container">
                <p data-i18n="loading">Carregando experiências...</p>
            </div>
        </section>

        <!-- 5. PROJETOS EM DESTAQUE -->
        <section id="projects" style="margin-bottom: var(--spacing-lg);">
            <h2 data-i18n="section_projects"
                style="border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-bottom: var(--spacing-md); text-transform: uppercase; font-size: 1rem; letter-spacing: 2px;">
                Projetos em Destaque
            </h2>
            <div id="projects-container">
                <!-- JS injeta aqui -->
            </div>
        </section>

        <!-- 6. EDUCAÇÃO E IDIOMAS -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: var(--spacing-lg);">
            <section id="education">
                <h2 data-i18n="section_education"
                    style="border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; text-transform: uppercase; font-size: 1rem; letter-spacing: 2px;">
                    Educação</h2>
                <div id="education-container"></div>
            </section>

            <section id="languages">
                <h2 data-i18n="section_languages"
                    style="border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; text-transform: uppercase; font-size: 1rem; letter-spacing: 2px;">
                    Idiomas</h2>
                <div id="languages-container"></div>
            </section>
        </div>
    </main>

    <script type="module" src="./src/js/app.js"></script>
</body>

</html>
